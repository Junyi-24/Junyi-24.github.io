<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Junyi Li">
  <!-- <meta name="description" content="Junyi Li — Ph.D. student at the Institute for Network Sciences and Cyberspace, Tsinghua University. Research: autonomous driving for LEO satellites, LEO satellite network O&M, on-board AI and in-orbit computing."> -->
  <title>Junyi Li</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- Apply saved theme and language before CSS loads to avoid a flash -->
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (saved === "dark" || (!saved && prefersDark)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
      if (localStorage.getItem("lang") === "zh") {
        document.documentElement.setAttribute("data-lang", "zh");
        document.documentElement.setAttribute("lang", "zh");
      }
    })();
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Corner controls: language toggle + theme toggle -->
  <div class="corner-controls">
    <button id="lang-toggle" class="icon-button" aria-label="Switch language" title="中 / EN">
      <span class="lang-zh">中</span>
      <span class="lang-en">EN</span>
    </button>
    <button id="theme-toggle" class="icon-button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>

  <div class="container">

    <!-- ============================ Profile header ============================ -->
    <header class="profile">
      <!-- Profile photo: replace assets/images/junyili_personal.jpg to update -->
      <img class="avatar" src="assets/images/junyili_personal.jpg" alt="Junyi Li">

      <div class="profile-info">
        <h1 class="name">Junyi Li <span class="name-zh">李俊懿</span></h1>
        <p class="affiliation">
          <span class="en">Ph.D. Student<br><a href="https://www.insc.tsinghua.edu.cn/">Institute for Network Sciences and Cyberspace (INSC)</a><br>Tsinghua University</span>
          <span class="zh">博士研究生<br><a href="https://www.insc.tsinghua.edu.cn/">清华大学网络科学与网络空间研究院</a></span>
        </p>
        <ul class="contact">
          <li><a href="mailto:lijunyi24@mails.tsinghua.edu.cn">Email</a></li>
          <li><a href="https://github.com/Junyi-24">GitHub</a></li>
          <!-- Add your Google Scholar profile when available:
          <li><a href="https://scholar.google.com/citations?user=YOUR_ID">Google Scholar</a></li>
          -->
        </ul>
      </div>
    </header>

    <!-- =============================== Sections ===============================
         Each section below is an empty shell: its content lives in a separate
         file under sections/ and is loaded by js/main.js. Edit the file in
         sections/ to update a section. -->
    <main>
      <section id="about"        data-include="sections/about.html"></section>
      <section id="interests"    data-include="sections/interests.html"></section>
      <section id="education"    data-include="sections/education.html"></section>
      <!-- <section id="news"         data-include="sections/news.html"></section> -->
      <section id="publications" data-include="sections/publications.html"></section>
      <section id="honors"       data-include="sections/honors.html"></section>
      <section id="experience"   data-include="sections/experience.html"></section>
    </main>

    <footer>
      <p><span class="en">© 2026 Junyi Li · Last updated: 2026.08</span><span class="zh">© 2026 李俊懿 · 最后更新：2026.08</span></p>
    </footer>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
